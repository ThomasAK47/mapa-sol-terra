<!doctype html>
<!--
  =============================================================================
  _modelo.html: MODELO para criar uma animação do Mapa de Estudos Sol–Terra.

  Como usar:
    1. Copie este arquivo com outro nome: letras minúsculas, sem acento e sem
       espaço (ex.: "minha-animacao.html"). Arquivos que começam com "_" não
       entram no mapa; por isso este modelo não aparece na lista.
    2. Troque o <title>, a legenda e a função desenhar() (seção 4).
    3. Registre o arquivo em animacoes/manifesto.json.
  As regras completas estão em animacoes/CONTRATO.md.

  Textos editáveis (o botão "Editar textos" da janela do mapa): marque os
  textos fixos com data-texto="nome", escreva os textos do desenho como
  T_`…` e os do painel montados pelo script como H_`…` (as fórmulas e as
  contas ficam de fora). As trocas ficam no bloco "textos-editados", logo
  antes do script. Veja "Textos editáveis" no CONTRATO.md.

  Onde a animação roda: numa janela grande do mapa, dentro de um
  <iframe sandbox="allow-scripts">. Por isso:
    • tudo fica neste arquivo (HTML, CSS e JavaScript); bibliotecas, só por CDN;
    • não use localStorage, sessionStorage, cookies, alert(), window.open(),
      links que abrem abas, formulários com envio nem tela cheia: o navegador
      bloqueia tudo isso;
    • o tamanho da área muda com a janela, e a animação se ajusta sozinha.
  =============================================================================
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Título da animação</title>
  <style>
    /* A animação ocupa a área inteira, com fundo preto. */
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #e9e9e9;
      font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    }
    /* O canvas cobre tudo; o tamanho em pixels é ajustado no script. */
    #tela { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

    /* Título e nota no canto superior esquerdo. A sombra preta mantém os
       textos legíveis por cima do desenho. */
    .legenda { position: fixed; left: 16px; top: 12px; right: 16px; pointer-events: none;
               text-shadow: 0 0 4px #000, 0 0 10px #000, 0 0 16px #000; }
    .legenda h1 { margin: 0; font-size: 15px; font-weight: 600; }
    .legenda p { margin: 2px 0 0; font-size: 12.5px; color: #8a8a8a; }

    /* Controles embaixo, no centro. */
    .controles {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      max-width: calc(100% - 24px);
      padding: 8px 12px;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      background: rgba(12, 12, 12, 0.85);
    }
    button {
      height: 30px;
      padding: 0 12px;
      border: 1px solid #3a3a3a;
      border-radius: 8px;
      background: transparent;
      color: #e9e9e9;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { background: #1b1b1b; }
    label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: #a6a6a6; }
    input[type="range"] { width: 120px; accent-color: #e9e9e9; }

    /* Aviso de problema (ex.: uma biblioteca da internet não carregou). */
    #aviso { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; background: #000; }
    #aviso[hidden] { display: none; }
    #aviso p { max-width: 480px; margin: 0; line-height: 1.6; }
  </style>
</head>
<body>
  <canvas id="tela"></canvas>

  <div class="legenda">
    <h1 data-texto="titulo">Título da animação</h1>
    <p data-texto="legenda">Uma frase sobre o que a animação mostra (e o que está fora de escala).</p>
  </div>

  <div class="controles">
    <button id="bt-pausar" type="button">Pausar</button>
    <button id="bt-recomecar" type="button">Recomeçar</button>
    <label><span data-texto="controle-velocidade">Velocidade</span> <input id="velocidade" type="range" min="0.25" max="3" step="0.25" value="1"></label>
  </div>

  <div id="aviso" hidden><p></p></div>

  <!--
    Biblioteca por CDN (opcional). Use sempre uma versão fixa ("@1.2.3") e
    coloque a tag AQUI, antes do script principal. Exemplo:
      <script src="https://cdn.jsdelivr.net/npm/nome-da-biblioteca@1.2.3/dist/arquivo.min.js"></script>
    No script principal, confira se ela chegou (sem internet, não chega):
      if (typeof NomeDaBiblioteca === 'undefined') {
        mostrarAviso('Esta animação precisa de internet para carregar uma biblioteca. ' +
                     'Verifique a conexão e clique em "Recomeçar", no alto da janela.');
      }
  -->

  <!-- Os textos trocados pelo botão "Editar textos" (o app grava aqui; deixe vazio ao criar). -->
  <script type="application/json" id="textos-editados">
{
  "versao": 1,
  "painel": {},
  "gerados": {},
  "desenho": {}
}
</script>
  <script>
    'use strict';

    // -------------------------------------------------------------------------
    // 1. Esc fecha a janela do mapa. OBRIGATÓRIO: mantenha este trecho.
    //    Com o foco dentro da animação, o Esc chega aqui, e não ao mapa. Esta
    //    mensagem pede ao mapa para fechar a janela. As outras mensagens que o
    //    app aceita são as do trecho 1b (textos editáveis).
    // -------------------------------------------------------------------------
    window.addEventListener('keydown', (evento) => {
      if (evento.key === 'Escape') window.parent.postMessage({ tipo: 'fechar-animacao' }, '*');
    });

    // -------------------------------------------------------------------------
    // 1b. Textos editáveis. OBRIGATÓRIO: mantenha este trecho (veja CONTRATO.md).
    //   No app, o botão "Editar textos" da janela da animação troca: os textos fixos do painel (marcados com
    //   data-texto), os textos do painel montados por este script (H_`…`) e os textos do desenho (T_`…`).
    //   As trocas ficam no bloco JSON "textos-editados", perto do fim do HTML; o texto original continua aqui no
    //   código. Dentro de T_`…` e H_`…`, cada ${…} vira um marcador {0}, {1}…: é onde entram os números.
    //   (T_ e H_ têm o traço para não colidir com variáveis da animação, como T de temperatura.)
    // -------------------------------------------------------------------------
    const TEXTOS_EDITADOS = (() => {
      const ler = (json) => {
        try {
          const d = JSON.parse(json);
          return { painel: d.painel || {}, gerados: d.gerados || {}, desenho: d.desenho || {} };
        } catch {
          return null;
        }
      };
      // A prévia que o app manda no endereço (depois do #) vale mais que os textos gravados no arquivo.
      const previa = new URLSearchParams(location.hash.slice(1)).get('textos');
      const bloco = document.getElementById('textos-editados');
      return (previa && ler(previa)) || (bloco && ler(bloco.textContent)) || { painel: {}, gerados: {}, desenho: {} };
    })();
    const ENFEITES_PERMITIDOS = { B: 'b', STRONG: 'b', I: 'i', EM: 'i', SUP: 'sup', SUB: 'sub', SMALL: 'small', BR: 'br', SPAN: 'span' };
    /** Deixa só os enfeites permitidos: negrito, itálico, sobrescrito, subscrito, letra menor, quebra de linha e
     *  trechos (span), com a classe e nenhum outro atributo. */
    function textoSeguro(html) {
      const modelo = document.createElement('template');
      modelo.innerHTML = String(html);
      const copiar = (origem, destino) => {
        for (const no of origem.childNodes) {
          if (no.nodeType === Node.TEXT_NODE) destino.append(no.nodeValue);
          else if (no.nodeType === Node.ELEMENT_NODE && no.tagName !== 'SCRIPT' && no.tagName !== 'STYLE') {
            const nome = ENFEITES_PERMITIDOS[no.tagName];
            if (!nome) {
              copiar(no, destino);
              continue;
            }
            const novo = document.createElement(nome);
            const classe = no.getAttribute('class');
            if (/^[a-z][a-z0-9-]*( [a-z][a-z0-9-]*)*$/.test(classe || '')) novo.className = classe;     // longo, curto, cores…
            copiar(no, novo);
            destino.append(novo);
          }
        }
      };
      const saida = document.createElement('div');
      copiar(modelo.content, saida);
      return saida.innerHTML;
    }
    /** A chave de um texto do código: o próprio texto, com {0}, {1}… no lugar de cada ${…}. */
    const chaveDoTexto = (partes) => partes.reduce((chave, parte, i) => chave + (i ? `{${i - 1}}` : '') + parte, '');
    const encaixarValores = (modelo, valores) => modelo.replace(/\{(\d+)\}/g, (marca, n) => (Number(n) < valores.length ? String(valores[n]) : marca));
    const textosVistos = new Map();       // texto do desenho → quando apareceu (o app pergunta o que está na tela)
    /** Um texto do desenho (simples, sem enfeites). */
    function T_(partes, ...valores) {
      const chave = chaveDoTexto(partes);
      textosVistos.set(chave, performance.now());
      const trocado = TEXTOS_EDITADOS.desenho[chave];
      return encaixarValores(typeof trocado === 'string' ? trocado : chave, valores);
    }
    /** Um texto do painel montado por este script (pode ter negrito, itálico, sobrescrito…). */
    function H_(partes, ...valores) {
      const chave = chaveDoTexto(partes);
      const trocado = TEXTOS_EDITADOS.gerados[chave];
      return encaixarValores(typeof trocado === 'string' ? textoSeguro(trocado) : chave, valores);
    }
    // Os textos fixos do painel (marcados com data-texto) recebem as trocas assim que a página abre.
    for (const elemento of document.querySelectorAll('[data-texto]')) {
      const trocado = TEXTOS_EDITADOS.painel[elemento.dataset.texto];
      if (typeof trocado === 'string') elemento.innerHTML = textoSeguro(trocado);
    }
    /** Conta ao app onde a animação está (para a prévia dos textos voltar ao mesmo lugar). */
    function avisarOndeEsta() {
      const lugar = typeof estado === 'object' && estado ? estado : {};     // estado.perto e estado.passo, se houver
      window.parent.postMessage({ tipo: 'animacao-esta-em', perto: Boolean(lugar.perto), passo: Number(lugar.passo) || 0 }, '*');
    }
    /** Numa prévia, volta à vista e ao passo de antes (eles vêm no endereço, depois do #). Fica no fim do script. */
    function voltarAoLugarDaPrevia() {
      const dados = new URLSearchParams(location.hash.slice(1));
      if (dados.get('perto') === '1' && typeof mostrarVisao === 'function') {
        mostrarVisao(true);
        if (typeof mostrarPasso === 'function') mostrarPasso(Number(dados.get('passo')) || 0);
      }
      avisarOndeEsta();
    }
    // O app pode perguntar quais textos do desenho estão na tela agora (os usados no último segundo).
    window.addEventListener('message', (evento) => {
      if (evento.source !== window.parent || evento.data?.tipo !== 'quais-textos-na-tela') return;
      const agora = performance.now();
      const chaves = [...textosVistos].filter(([, quando]) => agora - quando < 1000).map(([chave]) => chave);
      window.parent.postMessage({ tipo: 'textos-na-tela', chaves }, '*');
    });

    // -------------------------------------------------------------------------
    // 2. Canvas nítido e do tamanho da área.
    //    "largura" e "altura" são medidas da tela (pixels CSS). O desenho usa
    //    essas medidas, e o ajuste para telas de alta resolução é automático.
    // -------------------------------------------------------------------------
    const tela = document.getElementById('tela');
    const ctx = tela.getContext('2d');
    let largura = 0;
    let altura = 0;

    function ajustarTamanho() {
      const escala = window.devicePixelRatio || 1;
      largura = window.innerWidth;
      altura = window.innerHeight;
      tela.width = Math.round(largura * escala);
      tela.height = Math.round(altura * escala);
      ctx.setTransform(escala, 0, 0, escala, 0, 0);
      desenhar(); // redesenha na hora, mesmo pausado
    }
    window.addEventListener('resize', ajustarTamanho);

    // -------------------------------------------------------------------------
    // 3. Estado e controles.
    // -------------------------------------------------------------------------
    let tempo = 0;        // tempo da animação, em segundos (não anda na pausa)
    let pausado = false;
    let velocidade = 1;

    const botaoPausar = document.getElementById('bt-pausar');
    function alternarPausa() {
      pausado = !pausado;
      botaoPausar.textContent = pausado ? 'Continuar' : 'Pausar';
    }
    botaoPausar.addEventListener('click', alternarPausa);
    document.getElementById('bt-recomecar').addEventListener('click', () => {
      tempo = 0;
      desenhar();
    });
    document.getElementById('velocidade').addEventListener('input', (evento) => {
      velocidade = Number(evento.target.value);
    });
    // Teclado é opcional: só funciona depois de clicar na animação. (Com o
    // foco num botão, o Espaço já aperta o botão; por isso a condição.)
    window.addEventListener('keydown', (evento) => {
      if (evento.key === ' ' && evento.target === document.body) {
        evento.preventDefault();
        alternarPausa();
      }
    });

    // -------------------------------------------------------------------------
    // 4. O DESENHO: substitua o conteúdo desta função.
    //    Ela desenha o quadro do instante "tempo" e precisa funcionar em
    //    qualquer tamanho de área: use largura e altura, nunca medidas fixas.
    // -------------------------------------------------------------------------
    function desenhar() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, largura, altura);

      // Exemplo: um ponto que atravessa a área da esquerda para a direita.
      const menor = Math.min(largura, altura);
      const margem = menor * 0.1;
      const x = margem + ((tempo * 0.15) % 1) * (largura - 2 * margem);
      const y = altura / 2;
      ctx.fillStyle = '#e9e9e9';
      ctx.beginPath();
      ctx.arc(x, y, Math.max(4, menor * 0.015), 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#6e6e6e';
      ctx.font = '13px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(T_`Substitua este desenho pela animação`, largura / 2, y + 40);   // T_`…`: texto editável
    }

    // -------------------------------------------------------------------------
    // 5. Laço da animação: avança o tempo e desenha (cerca de 60 vezes por
    //    segundo). O passo é limitado para a animação não "pular" quando a
    //    aba volta a aparecer.
    // -------------------------------------------------------------------------
    let anterior = performance.now();
    function quadro(agora) {
      const passo = Math.min((agora - anterior) / 1000, 0.1);
      anterior = agora;
      if (!pausado) {
        tempo += passo * velocidade;
        desenhar();
      }
      requestAnimationFrame(quadro);
    }

    // -------------------------------------------------------------------------
    // 6. Aviso de problema na tela, em vez de uma área vazia.
    // -------------------------------------------------------------------------
    function mostrarAviso(texto) {
      const aviso = document.getElementById('aviso');
      aviso.querySelector('p').textContent = texto;
      aviso.hidden = false;
    }

    // Início.
    ajustarTamanho();
    requestAnimationFrame(quadro);
    voltarAoLugarDaPrevia();      // numa prévia dos textos, volta ao passo em que a animação estava
  </script>
</body>
</html>
